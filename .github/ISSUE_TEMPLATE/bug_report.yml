name: Bug report
description: Report something that does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what-happens
    attributes:
      label: What happens
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - canvas
        - generator
        - api
        - shared
        - infra
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, OS and Brume version
    validations:
      required: true
  - type: textarea
    id: attachment
    attributes:
      label: Attachment
      description: Project JSON export or screenshot, if useful
