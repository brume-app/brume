name: Task (team only)
description: Internal task for the Brume team
body:
  - type: input
    id: goal
    attributes:
      label: Goal
      description: One sentence
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: |
        - [ ]
    validations:
      required: true
  - type: input
    id: dependencies
    attributes:
      label: Dependencies
      description: For example, blocked by #12
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - canvas
        - generator
        - api
        - shared
        - infra
    validations:
      required: true
