name: Labeler

# pull_request_target runs the workflow from main with a write token, so pull
# requests from forks can be labelled too. Never check out or run the pull
# request's code in this workflow.
on:
  pull_request_target:

permissions:
  contents: read
  pull-requests: write

jobs:
  labels:
    name: Area labels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
