name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  title:
    name: Conventional Commits title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          scopes: |
            canvas
            generator
            api
            shared
            infra
            docs
            adr
            deps
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: The description must start with a lowercase letter.
